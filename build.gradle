plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.lite.tvhome'
    compileSdk 34
    defaultConfig {
        applicationId 'com.lite.tvhome'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
